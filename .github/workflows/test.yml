# `make test` on every push and pull request, in the two environments this repo
# supports: with a reasoner that runs, and with one that does not.
name: test

on:
  push:
  pull_request:

env:
  # Pinned, unlike the `latest` that `make setup` fetches: CI wants yesterday's ROBOT.
  ROBOT_VERSION: v1.9.10
  # The tag is mutable; the digest is what the pin actually claims.
  ROBOT_SHA256: 16a73c074f3df359a7338a84b4e0788785fe06117f931bb9796e9619ea776105

jobs:
  full:
    name: full suite (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install poetry
        run: pipx install poetry

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - run: poetry install

      - name: Cache robot.jar
        id: robot
        uses: actions/cache@v4
        with:
          path: robot.jar
          key: robot-${{ env.ROBOT_VERSION }}

      - name: Fetch robot.jar
        if: steps.robot.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o robot.jar \
            "https://github.com/ontodev/robot/releases/download/${ROBOT_VERSION}/robot.jar"

      # Checked on the restore path too: a cache entry is as forgeable as a download.
      - name: Verify robot.jar
        run: echo "${ROBOT_SHA256}  robot.jar" | sha256sum -c -

      - name: make test
        run: |
          set -o pipefail
          make test 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Exit 0 is also what a suite whose reasoner targets all skipped looks like, and a
      # jar this job never resolved reaches that. With a JDK and a verified jar, nothing may.
      - name: Assert nothing skipped
        run: |
          skips=$(grep -c '^SKIP' "$RUNNER_TEMP/build.log" || true)
          echo "skips: ${skips:-no log}"
          if [ "${skips:-x}" != 0 ]; then
            echo "FAIL: the full suite has a reasoner and skipped anyway, so it is green"
            echo "      over steps nothing performed:"
            grep '^SKIP' "$RUNNER_TEMP/build.log" || true
            exit 1
          fi

  no-reasoner:
    name: full suite (no usable reasoner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poetry
        run: pipx install poetry

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - run: poetry install

      - name: Cache robot.jar
        id: robot
        uses: actions/cache@v4
        with:
          path: robot.jar
          key: robot-${{ env.ROBOT_VERSION }}

      - name: Fetch robot.jar
        if: steps.robot.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o robot.jar \
            "https://github.com/ontodev/robot/releases/download/${ROBOT_VERSION}/robot.jar"

      - name: Verify robot.jar
        run: echo "${ROBOT_SHA256}  robot.jar" | sha256sum -c -

      # A java that exists and does not run, which is the macOS stub reproduced. The
      # runner ships a working JDK, so removing java would test absence instead.
      - name: Put a broken java first on PATH
        run: |
          mkdir -p "$HOME/stub"
          printf '#!/bin/sh\necho "Unable to locate a Java Runtime." >&2\nexit 1\n' \
            > "$HOME/stub/java"
          chmod +x "$HOME/stub/java"
          echo "$HOME/stub" >> "$GITHUB_PATH"

      - name: make test
        run: |
          set -o pipefail
          make test 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Exit 0 is also what a suite that never reached a reasoner target would do, so the
      # skips are the evidence. `exited 1` is the stub's own answer, and is required
      # because a skip reading "no ROBOT found" is the absence case this job is not.
      - name: Assert the reasoner targets probed the stub and skipped
        run: |
          log="$RUNNER_TEMP/build.log"
          skips=$(grep -c '^SKIP' "$log" || true)
          probed=$(grep -c '^SKIP.*--version exited 1' "$log" || true)
          echo "skips: ${skips:-no log}, of which probed: ${probed:-no log}"
          if [ "${probed:-0}" = 0 ]; then
            echo "FAIL: make test passed without a usable reasoner and nothing probed one;"
            echo "      either a reasoner was found after all, or no target got that far."
            exit 1
          fi
          if [ "${skips:-x}" != "${probed:-0}" ]; then
            echo "FAIL: a step skipped for a reason other than the stub, so this job is"
            echo "      no longer only about a reasoner that does not run:"
            grep '^SKIP' "$log" | grep -v -- '--version exited 1'
            exit 1
          fi
